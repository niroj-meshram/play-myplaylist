name: play-my-playlist

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pmp
      POSTGRES_PASSWORD: pmp_dev_password
      POSTGRES_DB: play_my_playlist
    ports:
      - '${PMP_POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmp -d play_my_playlist']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${PMP_REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
